# JVM memory tuning (adjust based on RAM)
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 --enable-native-access=ALL-UNNAMED
# Performance
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.configureondemand=false
org.gradle.caching=false
# Android
android.useAndroidX=true
android.experimental.skipJdkImageTransform=true
# Kotlin optimization
kotlin.daemon.jvm.options=-Xmx2g
kotlin.incremental=true
# Build speed
org.gradle.vfs.watch=true
# Flutter 3.47 still reads AGP's legacy DSL, but Kotlin can use AGP 9's
# built-in compiler independently.
android.newDsl=false
android.builtInKotlin=true
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE,DEPRECATED_DSL
# Flutter's Gradle plugin still reads Task.project during execution.
org.gradle.configuration-cache=false
